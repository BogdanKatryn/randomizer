
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рандомайзер</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f3f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 30px #0001;
        }

        .number {
            font-size: 100px;
            font-weight: bold;
            color: #6548e8;
            margin: 25px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            background: #6548e8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Рандомайзер</h1>
        <p>Випадкове число від 1 до 1000</p>

        <div class="number">{{ number }}</div>

        <button onclick="location.reload()">
            Згенерувати ще раз
        </button>
    </main>
</body>
</html>
